name: Chart previews

# Push to the "previews-request" branch to render small previews of the chart sheets
# and of the Burgos area into the "previews" branch (used to check sheet margins).
on:
  push:
    branches: [previews-request]

permissions:
  contents: write

jobs:
  previews:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: src
      - name: AIP data
        run: mkdir -p out && python3 src/tools/build-aip.py out/aip.json || true
      - name: Probe
        run: |
          mkdir -p out
          python3 src/tools/probe-services.py out 2>&1 | tee out/log.txt
      - name: Publish to previews branch
        run: |
          cd out
          git init -q -b previews
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add -A && git commit -qm "Chart previews"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" previews
