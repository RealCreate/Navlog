name: Chart previews

# Push to the "previews-request" branch to render small previews of the chart sheets
# and of the Burgos area into the "previews" branch (used to check sheet margins).
on:
  push:
    branches: [previews-request]

permissions:
  contents: write

jobs:
  previews:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: src
      - name: AIP data
        run: mkdir -p out && python3 src/tools/build-aip.py out/aip.json || true
      - name: Probe
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq gdal-bin python3-gdal
          mkdir -p out
          curl -fsSL https://aip.enaire.es/AIP/CartasInsigniaImpresas-es.html -o page.html
          grep -oiE 'recursos/descargas/VFR500/[A-Za-z0-9_]+[.]zip' page.html | sort -u > out/sheets.txt
          for path in $(cat out/sheets.txt); do
            n=$(basename $path .zip)
            curl -fsSL "https://aip.enaire.es/$path" -o z.zip || continue
            mkdir -p x && unzip -q -o z.zip -d x
            tif=$(find x -iname '*.tif*' | head -1)
            echo "$n $(du -h z.zip | cut -f1) $(gdalinfo "$tif" | grep -E 'Size is')" >> out/sizes.txt
            python3 src/tools/probe-bounds.py "$tif" "$n" >> out/bounds.txt || true
            opts=""; gdalinfo "$tif" | grep -q 'Color Table' && opts="-expand rgb"
            gdal_translate -q $opts -of PNG -outsize 700 0 "$tif" "out/$n.png" || true
            rm -rf x z.zip
          done
          ls -la out
      - name: Publish to previews branch
        run: |
          cd out
          git init -q -b previews
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add -A && git commit -qm "Chart previews"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" previews
