name: Chart previews

# Push to the "previews-request" branch to render small previews of the chart sheets
# and of the Burgos area into the "previews" branch (used to check sheet margins).
on:
  push:
    branches: [previews-request]

permissions:
  contents: write

jobs:
  previews:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: src
      - name: AIP data
        run: mkdir -p out && python3 src/tools/build-aip.py out/aip.json || true
      - name: Probe AEMET
        run: |
          mkdir -p out
          UA='Mozilla/5.0 (Macintosh; Intel Mac OS X 14_0) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Safari/605.1.15'
          for u in 'https://opendata.aemet.es/opendata/api/mapasygraficos/analisis' \
                   'https://ama.aemet.es/en' \
                   'https://www.aemet.es/es/eltiempo/prediccion/aviacion' \
                   'https://aviationweather.gov/data/products/swl/ll_12_cl_new.gif' ; do
            code=$(curl -s --max-time 20 -o /dev/null -w '%{http_code}' -A "$UA" -L "$u" || true); echo "$code $u" | tee -a out/probe.txt
          done
          curl -s --max-time 20 -A "$UA" 'https://opendata.aemet.es/opendata/api/mapasygraficos/analisis' | head -c 400 > out/aemet-nokey.txt || true
      - name: Publish to previews branch
        run: |
          cd out
          git init -q -b previews
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add -A && git commit -qm "Chart previews"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" previews
