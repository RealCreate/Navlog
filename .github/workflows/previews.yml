name: Chart previews

# Push to the "previews-request" branch to render small previews of the chart sheets
# and of the Burgos area into the "previews" branch (used to check sheet margins).
on:
  push:
    branches: [previews-request]

permissions:
  contents: write

jobs:
  previews:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: src
      - name: AIP data
        run: mkdir -p out && python3 src/tools/build-aip.py out/aip.json || true
      - name: Probe
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
          mkdir -p out
          for r in castilla-y-leon la-rioja; do curl -fsSL "https://download.geofabrik.de/europe/spain/$r-latest.osm.pbf" -o $r.pbf; done
          osmium merge castilla-y-leon.pbf la-rioja.pbf -o all.pbf
          osmium extract -b -4.35,41.85,-2.15,42.95 all.pbf -o box.pbf --overwrite
          osmium tags-filter box.pbf w/waterway=river w/natural=water r/natural=water n/place=city,town,village w/landuse=residential w/highway=motorway,trunk,primary,secondary,tertiary,motorway_link,trunk_link w/railway=rail -o feat.pbf --overwrite
          osmium export feat.pbf -f geojsonseq -o out/feat.geojsonseq --overwrite
          ls -la out
      - name: Publish to previews branch
        run: |
          cd out
          git init -q -b previews
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add -A && git commit -qm "Chart previews"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" previews
