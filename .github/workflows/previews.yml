name: Chart previews

# Push to the "previews-request" branch to render small previews of the chart sheets
# and of the Burgos area into the "previews" branch (used to check sheet margins).
on:
  push:
    branches: [previews-request]

permissions:
  contents: write

jobs:
  previews:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: src
      - name: AIP data
        run: mkdir -p out && python3 src/tools/build-aip.py out/aip.json || true
      - name: Probe
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq gdal-bin
          mkdir -p out
          curl -fsSL https://aip.enaire.es/AIP/CartasInsigniaImpresas-es.html -o page.html
          grep -oiE "recursos/descargas/VFR500/[^\"' ]+\.zip" page.html | sort -u > out/sheets.txt
          cat out/sheets.txt
          for path in $(cat out/sheets.txt); do
            n=$(basename $path .zip)
            curl -fsSL "https://aip.enaire.es/$path" -o z.zip || continue
            ls -la z.zip >> out/sizes.txt
            mkdir -p x && unzip -q -o z.zip -d x
            tif=$(find x -iname '*.tif*' | head -1)
            echo "== $n $(du -h z.zip | cut -f1)" >> out/extents.txt
            gdalinfo "$tif" | grep -E "Size is|Upper Left|Lower Right|Pixel Size|Color Table" >> out/extents.txt
            gdalwarp -q -t_srs EPSG:4326 -ts 800 0 "$tif" "out/$n-small.tif" && gdal_translate -q -of PNG $(gdalinfo "$tif" | grep -q 'Color Table' && echo "-expand rgb") "out/$n-small.tif" "out/$n.png" && rm "out/$n-small.tif"
            gdalinfo -json "out/$n.png" >/dev/null 2>&1 || true
            python3 -c "
from osgeo import gdal
import sys
ds=gdal.Warp('/tmp/w.vrt', '$tif', format='VRT', dstSRS='EPSG:4326')
gt=ds.GetGeoTransform(); print('$n', gt[0], gt[3], gt[0]+gt[1]*ds.RasterXSize, gt[3]+gt[5]*ds.RasterYSize)
" >> out/bounds.txt 2>&1 || true
            rm -rf x z.zip
          done
          ls -la out
      - name: Publish to previews branch
        run: |
          cd out
          git init -q -b previews
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add -A && git commit -qm "Chart previews"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" previews
