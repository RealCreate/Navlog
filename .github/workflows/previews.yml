name: Chart previews

# Push to the "previews-request" branch to render small previews of the chart sheets
# and of the Burgos area into the "previews" branch (used to check sheet margins).
on:
  push:
    branches: [previews-request]

permissions:
  contents: write

jobs:
  previews:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: src
      - name: AIP data
        run: mkdir -p out && python3 src/tools/build-aip.py out/aip.json || true
      - name: Probe
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          mkdir -p out
          for ad in LEPP LESO LEXJ LEHC LESA; do
            for n in 1 2 3; do
              curl -fsSL "https://aip.enaire.es/AIP/contenido_AIP/AD/AD2/$ad/LE_AD_2_${ad}_VAC_${n}_en.pdf" -o "$ad-vac$n.pdf" && pdftoppm -r 150 -png "$ad-vac$n.pdf" "out/$ad-vac$n" && pdftotext -layout "$ad-vac$n.pdf" "out/$ad-vac$n.txt" || true
            done
          done
          for ad in LEBG LERJ LEVT LEVD LELN LEPP LESO LEXJ LEHC LESA; do
            curl -fsSL "https://aip.enaire.es/AIP/contenido_AIP/AD/AD2/$ad/LE_AD_2_${ad}_en.pdf" -o "$ad-ad2.pdf" && pdftotext -layout "$ad-ad2.pdf" "out/$ad-ad2.txt" || echo "fail $ad" >> out/fail.txt
          done
          curl -sS -D out/aemet-headers.txt -H "Origin: https://realcreate.github.io" "https://opendata.aemet.es/opendata/api/mapasygraficos/analisis" -o out/aemet-body.txt || true
          curl -sS -X OPTIONS -D out/aemet-options.txt -H "Origin: https://realcreate.github.io" -H "Access-Control-Request-Method: GET" -H "Access-Control-Request-Headers: api_key" "https://opendata.aemet.es/opendata/api/mapasygraficos/analisis" -o /dev/null || true
          ls -la out
      - name: Publish to previews branch
        run: |
          cd out
          git init -q -b previews
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add -A && git commit -qm "Chart previews"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" previews
