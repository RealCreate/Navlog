<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0b0d12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Navlog">
  <title>Navlog</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="map" aria-label="VFR chart"></div>

  <!-- Date & time (top centre of the map area) -->
  <div class="glass timecard" id="timecard">
    <button class="icon-btn step" id="timeMinus" type="button" aria-label="5 minutes earlier"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
    <div class="time-col">
      <button class="time-label" id="timeLabel" type="button" aria-label="Choose date and time">
        <span class="time-main" id="timeMain">—</span>
        <span class="time-sub" id="timeSub">—</span>
        <span class="sun" id="sunRow"></span>
      </button>
      <input type="range" id="timeSlider" min="0" max="864" step="1" value="0" aria-label="Date and time of the flight">
    </div>
    <button class="icon-btn step" id="timePlus" type="button" aria-label="5 minutes later"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <input type="datetime-local" id="timePicker" class="visually-hidden" tabindex="-1" step="300">
  </div>

  <!-- Right column: brand, then map controls stacked underneath -->
  <div class="rightcol">
    <div class="glass pill brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-text">Navlog</span>
      <span class="brand-sub" id="brandSub">LEBG</span>
    </div>
    <button class="glass round" id="btnLayers" type="button" aria-label="Map layers">
      <svg viewBox="0 0 24 24"><path d="M12 3 2.5 8 12 13l9.5-5L12 3Z"/><path d="m2.5 12 9.5 5 9.5-5"/><path d="m2.5 16 9.5 5 9.5-5"/></svg>
    </button>
    <button class="glass round" id="btnHome" type="button" aria-label="Centre on route or Burgos">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
    </button>
  </div>

  <div class="glass popover" id="layersPop" hidden>
    <div class="pop-title">Chart</div>
    <label class="radio"><input type="radio" name="base" value="vfr" checked> ENAIRE VFR 1:500 000</label>
    <label class="radio"><input type="radio" name="base" value="topo"> Terrain (OpenTopoMap)</label>
    <div class="pop-sep"></div>
    <label class="check"><input type="checkbox" id="chkNames" checked> Town &amp; village names</label>
    <label class="check"><input type="checkbox" id="chkPoints" checked> Aerodromes &amp; VRPs</label>
    <label class="check"><input type="checkbox" id="chkMarks" checked> 2-minute marks &amp; HATs</label>
    <label class="check"><input type="checkbox" id="chkWinds" checked> Wind arrows</label>
    <div class="pop-sep"></div>
    <button class="btn wide" id="btnOffline" type="button">Save chart for offline</button>
    <div class="pop-note" id="chartInfo">AIP España · ENAIRE</div>
  </div>

  <!-- Mode chip -->
  <div class="glass chip" id="modeChip" role="status">
    <span class="dot"></span><span id="modeText">Tap the chart to add waypoints</span>
  </div>

  <!-- Left panel (wide screens) / bottom sheet (phones) -->
  <button class="glass panel-toggle" id="panelToggle" type="button" aria-label="Hide or show the flight plan panel">
    <svg viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg>
  </button>
  <section class="sheet glass-heavy" id="sheet" aria-label="Flight plan">
    <div class="grabber" id="grabber"><span></span></div>

    <div class="modebar">
      <div class="segmented" id="modes" role="tablist" aria-label="Section">
        <button role="tab" data-mode="plan" class="on">Flight plan</button>
        <button role="tab" data-mode="mb">Mass &amp; Balance</button>
      </div>
    </div>

    <div class="planbar" id="planBar">
      <label class="field callsign"><span>Callsign</span><input id="callsignInput" autocapitalize="characters" autocomplete="off" spellcheck="false"></label>
      <button class="btn small" id="btnPlans" type="button">Plans</button>
      <button class="btn small" id="btnWinds" type="button">Update winds</button>
    </div>

    <div class="summary" id="summary">
      <div class="stat"><span class="k">Distance</span><span class="v" id="sDist">0 NM</span></div>
      <div class="stat"><span class="k">Time</span><span class="v" id="sTime">00:00:00</span></div>
      <div class="stat"><span class="k">Trip fuel</span><span class="v" id="sTrip">0 L</span></div>
      <div class="stat"><span class="k">Min. req.</span><span class="v" id="sReq">—</span></div>
      <button class="btn primary" id="btnPdf" type="button">
        <svg viewBox="0 0 24 24"><path d="M12 3v12m0 0-4-4m4 4 4-4M5 19h14"/></svg>
        <span>Navlog PDF</span>
      </button>
    </div>

    <div class="summary" id="mbSummary" hidden>
      <div class="stat"><span class="k">Takeoff mass</span><span class="v" id="mTom">—</span></div>
      <div class="stat"><span class="k">TO CG</span><span class="v" id="mCg">—</span></div>
      <div class="stat"><span class="k">Landing mass</span><span class="v" id="mLm">—</span></div>
      <button class="btn primary" id="btnMbPdf" type="button">
        <svg viewBox="0 0 24 24"><path d="M12 3v12m0 0-4-4m4 4 4-4M5 19h14"/></svg>
        <span>M&amp;B PDF</span>
      </button>
    </div>

    <div class="tabs" id="planTabs">
      <div class="segmented" id="tabs" role="tablist">
        <button role="tab" data-tab="route" class="on">Route</button>
        <button role="tab" data-tab="navlog">Navlog</button>
        <button role="tab" data-tab="fuel">Fuel</button>
        <button role="tab" data-tab="brief">Briefing</button>
        <button role="tab" data-tab="profile" class="narrow-only">Profile</button>
      </div>
      <div class="segmented small" id="routeSel">
        <button data-route="main" class="on">Main</button>
        <button data-route="alt">Alternate</button>
      </div>
    </div>

    <div class="sheet-body" id="sheetBody">
      <div class="panel" data-panel="route"></div>
      <div class="panel" data-panel="navlog" hidden></div>
      <div class="panel" data-panel="fuel" hidden></div>
      <div class="panel" data-panel="brief" hidden></div>
      <div class="panel" data-panel="profile" hidden><div class="profile-panel"><canvas id="profileCanvasSheet"></canvas></div><p class="note" id="profileNoteSheet"></p></div>
      <div class="panel" data-panel="mb" hidden></div>
    </div>
  </section>

  <!-- Vertical profile (SkyDemon style), docked at the bottom on wide screens -->
  <section class="profile-dock glass-heavy" id="profileDock" aria-label="Vertical profile">
    <div class="profile-head">
      <span class="profile-title">Profile</span>
      <span class="profile-info" id="profileInfo"></span>
      <button class="icon-btn" id="profileToggle" type="button" aria-label="Collapse profile"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
    </div>
    <div class="profile-body"><canvas id="profileCanvas"></canvas></div>
  </section>

  <div class="glass popover plans-pop" id="plansPop" hidden>
    <div class="pop-title">Saved plans</div>
    <div id="plansList"></div>
    <div class="pop-sep"></div>
    <button class="btn wide" id="btnSavePlan" type="button">Save current plan</button>
    <button class="btn wide" id="btnNewPlan" type="button">New plan</button>
    <label class="btn wide file-btn">Open navlog PDF…<input type="file" id="pdfInput" accept="application/pdf"></label>
  </div>

  <div class="toast glass" id="toast" hidden></div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="vendor/pdf-lib/pdf-lib.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
